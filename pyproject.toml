[project]
name = "gnmyflow"
version = "0.3.1"
description = "GnmyFlow: a fast CLI and MCP server for Google Flow and Google Flow Music. Fork of StudioWright; unofficial and not affiliated with Google."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Umut Koçak" }]
maintainers = [{ name = "anggi-susanto" }]
dependencies = [
    "click>=8.5.0",
    "filelock>=4.1.0",
    "mcp[cli]>=2.3.0",
    "pillow>=11.0",
    "platformdirs>=4.12.4",
    "playwright>=1.63.0",
]

[project.scripts]
gnmyflow = "studiowright.cli:main"
studiowright = "studiowright.cli:main"
sw = "studiowright.cli:main"

[project.urls]
Repository = "https://github.com/anggi-susanto/gnmyflow"
Issues = "https://github.com/anggi-susanto/gnmyflow/issues"
Upstream = "https://github.com/umutkocak/studiowright"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/studiowright"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/studiowright/**/*.py",
    "/tests/**/*.py",
    "/scripts/audit_dist.py",
    "/scripts/smoke_install.py",
    "/plugins/gnmyflow/.claude-plugin/plugin.json",
    "/plugins/gnmyflow/.mcp.json",
    "/plugins/gnmyflow/skills/gnmyflow/SKILL.md",
    "/.claude-plugin/marketplace.json",
    "/pyproject.toml",
    "/README.md",
    "/LICENSE",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# Flow UI strings in tests and docs include Turkish letters.
allowed-confusables = ["ı"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]

[tool.ruff.lint.per-file-ignores]
# Spikes embed page JavaScript in long string literals.
"spikes/*" = ["E501"]
